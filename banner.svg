    <path d="M26 44 C26 24, 70 24, 70 44 Z" fill="#10b981" stroke="#111827" stroke-width="2.5" />
    <rect x="25" y="40" width="46" height="7" rx="3" fill="#059669" stroke="#111827" stroke-width="2" />
    <circle cx="48" cy="22" r="5" fill="#34d399" stroke="#111827" stroke-width="2">
      <animate attributeName="cy" values="22;19;22" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <ellipse cx="41" cy="50" rx="4.5" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.8" />
    <ellipse cx="55" cy="50" rx="4.5" ry="6" fill="#ffffff" stroke="#111827" stroke-width="1.8" />
    <circle cx="42" cy="50" r="1.8" fill="#111827" />
    <circle cx="54" cy="50" r="1.8" fill="#111827" />
    <line x1="43" y1="60" x2="53" y2="60" stroke="#111827" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <text x="175" y="58" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="30" font-weight="700">
